name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --prefix packages/tsbridge
      - run: npm test --prefix packages/tsbridge
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - if: runner.os == 'macOS'
        run: swift build --package-path apps/macos # the menu bar app

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
