[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
strata-core = { path = "crates/strata-core" }
strata-git = { path = "crates/strata-git" }
strata-checker = { path = "crates/strata-checker" }
strata-overlay = { path = "crates/strata-overlay" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
proptest = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
