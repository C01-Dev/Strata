[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/C01-Dev/Strata"
homepage = "https://github.com/C01-Dev/Strata"

[workspace.dependencies]
strata-core = { path = "crates/strata-core" }
strata-git = { path = "crates/strata-git" }
strata-checker = { path = "crates/strata-checker" }
strata-overlay = { path = "crates/strata-overlay" }
strata-proc = { path = "crates/strata-proc" }
strata-mcp = { path = "crates/strata-mcp" }
strata-proxy = { path = "crates/strata-proxy" }
strata-seed = { path = "crates/strata-seed" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
listeners = "0.6.1"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
proptest = "1.12.0"
rayon = "1.12.0"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

# The profile that `dist` builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
