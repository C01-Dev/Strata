# cargo deny check: advisories, licenses, bans, sources.

[licenses]
allow = ["MIT", "Apache-2.0", "BSL-1.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# tracing-attributes is the last dependency on syn 2; everything else moved to syn 3.
skip = [{ crate = "syn@2", reason = "tracing-attributes 0.1 still uses syn 2" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
