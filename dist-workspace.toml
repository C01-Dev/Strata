# Release builds (PLAN 5.3), driven by cargo-dist: `dist plan` to check, `dist generate` after
# edits (it rewrites .github/workflows/release.yml), a `v*` tag to release.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "homebrew"]
tap = "C01-Dev/homebrew-tap"
publish-jobs = ["homebrew", "./publish-npm"]
formula = "strata"
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
install-path = "CARGO_HOME"
install-updater = false
# release.yml is generated, then fixed by hand in three places; re-apply after `dist generate`:
# dist 0.34.0 writes a user publish job as `uses: $/.github/workflows/<job>.yml`, which GitHub
# rejects (it must be `./`); that job also needs `"contents": "read"`, since a called workflow
# cannot ask for more than its caller grants; and the tap is C01-Dev/homebrew-tap.
allow-dirty = ["ci"]

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
